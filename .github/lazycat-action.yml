version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: navidrome

build:
  toolchains: []
  run_buildscript: false

images:
  - id: navidrome
    target: service
    service: navidrome
    source: docker.1ms.run/deluan/navidrome
    channel: stable
    delivery:
      mode: direct

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Navidrome
    summary: Published from GitHub Actions
