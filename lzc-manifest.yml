application:
  subdomain: navidrome
  multi_instance: true
  upstreams:
    - location: /
      backend: http://navidrome:4533/
  public_path:
    - /
  health_check:
    test_url: http://navidrome:4533/ping
  injects:
    - id: navidrome-capture-password
      auth_required: false
      on: request
      when:
        - /auth/createAdmin
        - /auth/login
      do: |
        const method = String(ctx.request.method || "").toUpperCase();
        if (method !== "POST") return;

        let payload = null;
        try {
          payload = ctx.body.getJSON();
        } catch {
          payload = null;
        }
        if (!payload || typeof payload !== "object") return;

        if (typeof payload.username === "string" && payload.username.length > 0) {
          ctx.flow.set("navidrome.pending_username", payload.username);
        }
        if (typeof payload.password === "string" && payload.password.length > 0) {
          ctx.flow.set("navidrome.pending_password", payload.password);
        }
    - id: navidrome-commit-password
      auth_required: false
      on: response
      when:
        - /auth/createAdmin
        - /auth/login
      do: |
        if (ctx.status < 200 || ctx.status >= 300) return;

        const username = ctx.flow.get("navidrome.pending_username");
        const password = ctx.flow.get("navidrome.pending_password");
        if (typeof username === "string" && username.length > 0) {
          ctx.persist.set("navidrome.username", username);
        }
        if (typeof password === "string" && password.length > 0) {
          ctx.persist.set("navidrome.password", password);
        }
    - id: navidrome-login-autofill
      on: browser
      when:
        - /app/*#/login*
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: navidrome.username
            password:
              $persist: navidrome.password
            userSelector: "input[name='username']"
            passwordSelector: "input[name='password']"
            autoSubmit: false
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  navidrome:
    # upstream: docker.1ms.run/deluan/navidrome:0.63.2
    image: docker.1ms.run/deluan/navidrome:0.63.2
    user: "root"
    environment:
      - ND_PORT=4533
      - ND_DATAFOLDER=/data
      - ND_MUSICFOLDER=/lzcapp/run/mnt/home/{{ .U.music_dir }}
      - ND_DEEZER_LANGUAGE={{ .U.deezer_language }}
    binds:
      - /lzcapp/var/data:/data
ext_config:
  enable_document_access: true
usage: |
  首次打开 Navidrome 时，请在其原生初始化页面创建管理员账号。音乐库读取安装向导中选择的目录，应用数据保存在微服实例的持久目录中。
